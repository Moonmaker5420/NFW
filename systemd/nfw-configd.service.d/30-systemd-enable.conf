[Service]
# Service enable/disable writes symlinks under <target>.wants/. configd's
# apply paths call `systemctl enable <svc>` when a user turns on an
# optional service. Without these paths writable, the enables silently
# no-op — the sandbox blocks writes to /etc/systemd/system/.
ReadWritePaths=-/etc/systemd/system/multi-user.target.wants
ReadWritePaths=-/etc/systemd/system/timers.target.wants
