# OPNsense-style privilege separation:
# - key file is root:root 0400, never readable by the API process
# - systemd reads it as root at service start
# - systemd passes it to the service via a private credential namespace
# - the API sees the key only through $CREDENTIALS_DIRECTORY
[Service]
LoadCredential=cert:/var/lib/nfw/ca/certs/cert-1006.crt
LoadCredential=key:/var/lib/nfw/ca/private/1006.key
ExecStart=
ExecStart=/opt/nfw/venv/bin/uvicorn api.main:app --host 0.0.0.0 --port 8443 --workers 1 --ssl-keyfile ${CREDENTIALS_DIRECTORY}/key --ssl-certfile ${CREDENTIALS_DIRECTORY}/cert
