# NFW — TLS drop-in. Points at the bootstrap cert generated by install.sh.
[Service]
LoadCredential=cert:/var/lib/nfw/ca/bootstrap/web.crt
LoadCredential=key:/var/lib/nfw/ca/bootstrap/web.key
ExecStart=
ExecStart=/opt/nfw/venv/bin/uvicorn api.main:app --host 0.0.0.0 --port 8443 --workers 1 --ssl-certfile=${CREDENTIALS_DIRECTORY}/cert --ssl-keyfile=${CREDENTIALS_DIRECTORY}/key
