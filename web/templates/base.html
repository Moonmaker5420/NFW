<!doctype html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
  <link rel="mask-icon" href="/static/img/favicon-mask.svg" color="#58a6ff">
  <link rel="apple-touch-icon" href="/static/img/favicon.svg">

<script>
(function(){
  try {
    if (localStorage.getItem('nfw-theme') === 'light') {
      document.documentElement.classList.add('light');
    }
  } catch(e){}
})();
</script>

<script>
(function(){
  try {
    if (localStorage.getItem('nfw-sidebar-collapsed') === '1') {
      document.documentElement.classList.add('preload-collapsed');
    }
  } catch(e){}
})();
</script>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}NFW{% endblock %} — NFW</title>
  <link rel="stylesheet" href="/static/css/theme.css?v=1790568668">
  <link rel="stylesheet" href="/static/css/layout.css?v=1790568668">
  <link rel="stylesheet" href="/static/css/components.css?v=1790568668">
</head>
<body>
{% include "partials/header.html" %}
<div class="layout">
  {% include "partials/sidebar.html" %}
  <main class="content">
    {% block content %}{% endblock %}
  </main>
</div>
{% include "partials/footer.html" %}
<div class="toast-container"></div>
<script src="/static/js/theme.js?v=1790568668"></script>
<script src="/static/js/api.js?v=1790568668"></script>
<script src="/static/js/components/toast.js?v=1790568668"></script>

<script src="/static/js/components/table.js?v=1790568668"></script>
<script src="/static/js/chart.js?v=1790568668"></script>
<script src="/static/js/ws.js?v=1790568668"></script>
<script src="/static/js/app.js?v=1790568668"></script>
{% block scripts %}{% endblock %}
</body>
</html>
