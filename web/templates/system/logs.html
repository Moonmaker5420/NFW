{% extends "base.html" %}
{% block title %}Logs{% endblock %}
{% block content %}
<h1>Logs</h1>
<p class="subtitle">Tail of managed log files</p>
<div class="card">
  <div class="row between">
    <div class="row">
      <label class="field" style="margin:0">
        <select id="log-file">
          <option value="configd">configd</option>
          <option value="syslog">syslog</option>
          <option value="auth">auth</option>
        </select>
      </label>
      <label class="field" style="margin:0">
        <select id="log-lines">
          <option value="50">50 lines</option>
          <option value="100" selected>100 lines</option>
          <option value="500">500 lines</option>
        </select>
      </label>
      <button id="reload-btn" class="small">Reload</button>
    </div>
    <label class="row muted" style="font-size:12px">
      <input type="checkbox" id="auto-refresh" style="width:auto"> Auto (5s)
    </label>
  </div>
  <pre class="code log-line mt-4" id="log-content" style="max-height:600px">Loading…</pre>
</div>
{% endblock %}
{% block scripts %}
<script>
const $ = (id) => document.getElementById(id);
let timer = null;

async function load() {
  try {
    const f = $('log-file').value;
    const n = $('log-lines').value;
    const r = await nfw.api.get(`/api/system/logs/${f}?lines=${n}`);
    $('log-content').textContent = (r.lines || []).join('\n') || '(empty)';
  } catch (e) { $('log-content').textContent = 'Failed: ' + e.message; }
}
function schedule() {
  if (timer) clearInterval(timer);
  if ($('auto-refresh').checked) timer = setInterval(load, 5000);
}

document.addEventListener('DOMContentLoaded', () => {
  load();
  $('reload-btn').addEventListener('click', load);
  $('log-file').addEventListener('change', load);
  $('log-lines').addEventListener('change', load);
  $('auto-refresh').addEventListener('change', schedule);
});
</script>
{% endblock %}
